name: Deploy to GitHub Pages

# The site is plain static files, so there is no build step. The repository
# root is uploaded as is. Pushes to Behkooshan publish; the manual trigger is
# there for re-publishing without a code change.
on:
  push:
    branches: [Behkooshan]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it, so the published
# site is never left half written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
