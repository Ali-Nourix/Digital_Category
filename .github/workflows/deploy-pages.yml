name: Deploy to GitHub Pages

# One GitHub Pages site for two branches:
#
#   /            the digital catalogue   (branch Behkooshan-catalogue)
#   /products/   the product catalogue   (branch Behkooshan-products)
#
# This same file is in both branches. Whichever of the two is pushed, the
# run checks out the latest of each and publishes them together, so pushing
# one never takes the other off the site.
#
# The catalogue branch's own products/ folder (the raw research) is left out
# of the published copy: the product catalogue takes that address, and it
# carries the same research itself.
on:
  push:
    branches: [Behkooshan-catalogue, Behkooshan-products]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it, so the published
# site is never left half written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Behkooshan-catalogue
          path: catalogue

      - uses: actions/checkout@v4
        with:
          ref: Behkooshan-products
          path: products

      # The product site without what only building it needs: the original
      # photographs (the site shows webp copies), the data and the tools.
      # The original texture files stay, because they are the downloads.
      - name: Put the two sites together
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude /products catalogue/ _site/
          rsync -a --exclude .git --exclude .github \
                --exclude '/research/products/*/images' \
                --exclude /tools --exclude /data --exclude /docs \
                products/ _site/products/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
