<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صفحه پیدا نشد | به‌کوشان</title>
  <meta name="robots" content="noindex">

  <!-- Inlined so this page makes no network request at all, including the
       implicit /favicon.ico fallback. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20fill%3D%27%2314754d%27%2F%3E%3Cg%20transform%3D%27translate%2813%2012%29%20scale%280.774%29%27%20fill%3D%27%23e9f0ec%27%3E%3Cpath%20d%3D%27M41.12%2C0L0%2C5.58v46.11h49.15L41.12%2C0ZM6.33%2C46.12L10.55%2C8.37h17.36l1.52%2C13.55-15.42%2C3.8%2C23.3%2C4.6%2C1.77%2C15.79H6.33Z%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">

  <!--
    This page is deliberately self contained: inline styles, an inline mark,
    and no external requests. GitHub Pages serves 404.html at whatever path
    was requested, so a relative href to assets/ would resolve against the
    missing URL rather than against this file and break. The trade off is
    that the brand faces are not available here, so the system stack stands
    in for them.
  -->
  <style>
    :root {
      --green: #14754d;
      --tint: #e9f0ec;
      --muted: #4a544e;
      --ink: #101412;
      --paper: #ffffff;
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-block-size: 100dvh;
      display: grid;
      place-content: center;
      gap: 1rem;
      padding: 2rem;
      background-color: var(--tint);
      color: var(--ink);
      font-family: system-ui, sans-serif;
      line-height: 1.7;
      text-align: center;
    }

    svg { inline-size: 2.5rem; block-size: auto; margin-inline: auto; fill: var(--green); }
    h1 { font-size: clamp(1.5rem, 1.2rem + 1.5vw, 2rem); line-height: 1.3; font-weight: 700; }
    p { color: var(--muted); }
    p[lang="en"] { font-size: 0.9rem; }

    a {
      justify-self: center;
      margin-block-start: 1rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0;
      background-color: var(--green);
      color: var(--paper);
      font-weight: 600;
      text-decoration: none;
    }

    a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
  </style>
</head>
<body>
  <svg viewBox="0 0 49.15 51.7" role="img" aria-label="به‌کوشان">
    <path d="M41.12,0L0,5.58v46.11h49.15L41.12,0ZM6.33,46.12L10.55,8.37h17.36l1.52,13.55-15.42,3.8,23.3,4.6,1.77,15.79H6.33Z"/>
  </svg>

  <h1>صفحه‌ای که دنبالش بودید پیدا نشد</h1>
  <p>شاید نشانی عوض شده باشد.</p>
  <p lang="en" dir="ltr">The page you asked for does not exist.</p>

  <a href="/" id="home">بازگشت به خانه</a>

  <script>
    // On a github.io project site this page lives under a sub-path such as
    // /Digital_Category/, so a bare "/" would leave the project entirely.
    // On a custom domain the site is at the root and "/" is already correct,
    // which is also what happens if this script never runs.
    if (location.hostname.endsWith("github.io")) {
      var project = location.pathname.split("/")[1];
      if (project) document.getElementById("home").href = "/" + project + "/";
    }
  </script>
</body>
</html>
