<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Behkooshan</title>
  <meta name="description" content="Behkooshan Stone Processing Company gallery: the stone in finished projects, and the quarries.">

  <link rel="icon" href="../assets/logos/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f5a3b">
  <link rel="alternate" hreflang="fa" href="../gallery.html">
  <link rel="alternate" hreflang="en" href="./gallery.html">

  <link rel="preload" href="../assets/fonts/tt-firs-neue/TTFirsNeue-VarRoman.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="../assets/css/fonts.css">
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/shapes.css">
  <link rel="stylesheet" href="../assets/css/gallery.css">
  <link rel="stylesheet" href="../assets/css/lightbox.css">

  <!-- Marks the document as scripted before anything paints, so the reveal's
       hidden starting state only ever applies where the script can undo it. -->
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="shell site-header__inner">
      <a class="site-header__logo" href="./" aria-label="Behkooshan, home">
        <span class="bk-logo bk-logo--mark site-header__mark"></span>
        <span class="bk-logo bk-logo--lockup site-header__lockup"></span>
      </a>

      <nav class="site-nav" aria-label="Main">
        <a href="./products/">Products</a>
        <a href="./gallery.html" aria-current="page">Gallery</a>
        <a href="./about.html">About</a>
      </nav>

      <a class="lang-switch" href="../gallery.html" lang="fa"
         aria-label="فارسی">FA</a>
    </div>
  </header>

  <main class="page" id="main">
    <div class="shell">

      <nav class="breadcrumb" aria-label="Breadcrumb">
        <ol>
        <li><a href="./">Home</a></li>
        <li aria-current="page">Gallery</li>
        </ol>
      </nav>

      <div class="gallery__head">
        <h1>Gallery</h1>
        <p>Behkooshan stone in finished projects, and the quarries it comes from.</p>
      </div>

      <ul class="gallery__grid reveal">
        <li class="gallery__cell gallery__cell--c2">
          <img class="gallery__img" src="../assets/images/gallery-kitchen-island-silver-vein.webp"
               alt="A kitchen with the island and splashback in a black stone with silver veining, set among pale cabinetry"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--r2">
          <img class="gallery__img" src="../assets/images/gallery-powder-room-grey-stone.webp"
               alt="A small powder room whose walls and pedestal basin are cut from one grey stone with a fine grain"
               width="1333" height="2000" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell">
          <img class="gallery__img" src="../assets/images/gallery-kitchen-island-black-white.webp"
               alt="A kitchen island in a stone of broad black and white banding, against dark timber cabinetry"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--c2">
          <img class="gallery__img" src="../assets/images/gallery-kitchen-black-terrazzo.webp"
               alt="A kitchen with the wall and worktops in a black stone carrying large pale pebble inclusions, beside walnut"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--shape" aria-hidden="true">
          <span class="bk-shape bk-shape--09"></span>
        </li>
        <li class="gallery__cell">
          <img class="gallery__img" src="../assets/images/gallery-island-sink-dark-green.webp"
               alt="Looking down on a dark green stone island, its sink cut from the same slab"
               width="2000" height="1440" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--shape" aria-hidden="true">
          <span class="bk-shape bk-shape--15"></span>
        </li>
        <li class="gallery__cell gallery__cell--c2">
          <img class="gallery__img" src="../assets/images/gallery-quarry-benches.webp"
               alt="A quarry face of cut benches in pale stone, a yellow excavator at the foot of the wall"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--c4">
          <img class="gallery__img" src="../assets/images/gallery-quarry-valley.webp"
               alt="The quarry in its valley, the cut wall on the left and the mountains beyond, in black and white"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
      </ul>

    </div>
  </main>

  <footer class="site-footer">
    <span class="bk-shape bk-shape--03 site-footer__shape" aria-hidden="true"></span>
    <div class="shell site-footer__inner">
      <p>No 10 (286), 5th Sonbol, Zakariya St., Shams Abad Industrial Zone, Tehran, Iran</p>
      <p class="tagline">Beautifully Strong</p>
      <p><a href="https://behkooshan.ir">behkooshan.ir</a></p>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="Gallery">
    <div class="lightbox__bar">
      <p class="lightbox__counter" id="lightbox-counter" data-template="% of %"></p>

      <div class="lightbox__tools">
        <button type="button" class="lightbox__button" data-lightbox="zoom"
                aria-pressed="false" data-in="Zoom in" data-out="Zoom out">
          <span class="lightbox__glyph" aria-hidden="true">+</span>
          <span class="visually-hidden" id="lightbox-zoom-label">Zoom in</span>
        </button>
        <button type="button" class="lightbox__button" data-lightbox="close" aria-label="Close">
          <span class="lightbox__glyph" aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>

    <div class="lightbox__stage" id="lightbox-stage">
      <img class="lightbox__img" id="lightbox-img" alt="">
    </div>

    <div class="lightbox__foot">
      <button type="button" class="lightbox__button" data-lightbox="prev" aria-label="Previous image">
        <span class="lightbox__glyph lightbox__glyph--prev" aria-hidden="true">&larr;</span>
      </button>

      <p class="lightbox__caption" id="lightbox-caption"></p>

      <button type="button" class="lightbox__button" data-lightbox="next" aria-label="Next image">
        <span class="lightbox__glyph lightbox__glyph--next" aria-hidden="true">&rarr;</span>
      </button>
    </div>
  </dialog>

  <script src="../assets/js/reveal.js" defer></script>
  <script src="../assets/js/lightbox.js" defer></script>
</body>
</html>
