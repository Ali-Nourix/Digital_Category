<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تصاویر | به‌کوشان</title>
  <meta name="description" content="گالری تصاویر شرکت فرآورسنگ به‌کوشان: سنگ اجراشده در پروژه‌ها و معادن.">

  <link rel="icon" href="assets/logos/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0f5a3b">
  <link rel="alternate" hreflang="fa" href="./gallery.html">
  <link rel="alternate" hreflang="en" href="en/gallery.html">

  <link rel="preload" href="assets/fonts/rokh/Rokh-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/rokh/Rokh-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <link rel="stylesheet" href="assets/css/shapes.css">
  <link rel="stylesheet" href="assets/css/gallery.css">
  <link rel="stylesheet" href="assets/css/lightbox.css">

  <!-- Marks the document as scripted before anything paints, so the reveal's
       hidden starting state only ever applies where the script can undo it. -->
  <script>document.documentElement.classList.add("js")</script>
</head>
<body>
  <a class="skip-link" href="#main">رفتن به محتوای اصلی</a>

  <header class="site-header">
    <div class="shell site-header__inner">
      <a class="site-header__logo" href="./" aria-label="به‌کوشان، صفحه نخست">
        <span class="bk-logo bk-logo--mark site-header__mark"></span>
        <span class="bk-logo bk-logo--lockup-fa site-header__lockup"></span>
      </a>

      <nav class="site-nav" aria-label="ناوبری اصلی">
        <a href="./products/">محصولات</a>
        <a href="./gallery.html" aria-current="page">تصاویر</a>
        <a href="./about.html">درباره ما</a>
      </nav>

      <a class="lang-switch" href="en/gallery.html" lang="en"
         aria-label="English">EN</a>
    </div>
  </header>

  <main class="page" id="main">
    <div class="shell">

      <nav class="breadcrumb" aria-label="مسیر صفحه">
        <ol>
        <li><a href="./">خانه</a></li>
        <li aria-current="page">تصاویر</li>
        </ol>
      </nav>

      <div class="gallery__head">
        <h1>تصاویر</h1>
        <p>سنگ به‌کوشان در پروژه‌های اجراشده، و معادنی که از آن‌ها می‌آید.</p>
      </div>

      <ul class="gallery__grid reveal">
        <li class="gallery__cell gallery__cell--c2">
          <img class="gallery__img" src="assets/images/gallery-kitchen-island-silver-vein.webp"
               alt="آشپزخانه‌ای با جزیره و دیوارۀ پشتی از سنگ سیاه با رگه‌های نقره‌ای، در میان کابینت‌های روشن"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--r2">
          <img class="gallery__img" src="assets/images/gallery-powder-room-grey-stone.webp"
               alt="سرویس بهداشتی کوچکی که دیوارها و روشویی یکپارچه‌اش از یک سنگ خاکستری با بافت باریک بریده شده"
               width="1333" height="2000" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell">
          <img class="gallery__img" src="assets/images/gallery-kitchen-island-black-white.webp"
               alt="جزیرۀ آشپزخانه از سنگی با رگه‌های پهن سیاه و سفید، مقابل کابینت‌های چوب تیره"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--c2">
          <img class="gallery__img" src="assets/images/gallery-kitchen-black-terrazzo.webp"
               alt="آشپزخانه‌ای با دیوار و صفحۀ کار از سنگ سیاه با قلوه‌های روشن درشت، کنار چوب گردویی"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--shape" aria-hidden="true">
          <span class="bk-shape bk-shape--09"></span>
        </li>
        <li class="gallery__cell">
          <img class="gallery__img" src="assets/images/gallery-island-sink-dark-green.webp"
               alt="نمای از بالا به جزیره‌ای از سنگ سبز تیره، با سینک یکپارچه که از همان اسلب درآمده"
               width="2000" height="1440" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--shape" aria-hidden="true">
          <span class="bk-shape bk-shape--15"></span>
        </li>
        <li class="gallery__cell gallery__cell--c2">
          <img class="gallery__img" src="assets/images/gallery-quarry-benches.webp"
               alt="جبهۀ معدن با پله‌های برش‌خوردۀ سنگ روشن و یک بیل مکانیکی زرد در پای دیواره"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
        <li class="gallery__cell gallery__cell--c4">
          <img class="gallery__img" src="assets/images/gallery-quarry-valley.webp"
               alt="معدن در دل دره، با دیوارۀ برش‌خورده در سمت چپ و کوه‌های دوردست، سیاه و سفید"
               width="2000" height="1333" sizes="(min-width: 62rem) 40vw, (min-width: 34rem) 50vw, 92vw" data-zoom loading="lazy" decoding="async">
        </li>
      </ul>

    </div>
  </main>

  <footer class="site-footer">
    <span class="bk-shape bk-shape--03 site-footer__shape" aria-hidden="true"></span>
    <div class="shell site-footer__inner">
      <p>تهران، شهرک صنعتی شمس‌آباد، کوچه سنبل ۵، پلاک ۲۸۶</p>
      <p class="tagline" lang="en">Beautifully Strong</p>
      <p><a href="https://behkooshan.ir" lang="en">behkooshan.ir</a></p>
    </div>
  </footer>

  <dialog class="lightbox" id="lightbox" aria-label="تصاویر">
    <div class="lightbox__bar">
      <p class="lightbox__counter" id="lightbox-counter" data-template="% از %"></p>

      <div class="lightbox__tools">
        <button type="button" class="lightbox__button" data-lightbox="zoom"
                aria-pressed="false" data-in="بزرگ‌نمایی" data-out="کوچک‌نمایی">
          <span class="lightbox__glyph" aria-hidden="true">+</span>
          <span class="visually-hidden" id="lightbox-zoom-label">بزرگ‌نمایی</span>
        </button>
        <button type="button" class="lightbox__button" data-lightbox="close" aria-label="بستن">
          <span class="lightbox__glyph" aria-hidden="true">&times;</span>
        </button>
      </div>
    </div>

    <div class="lightbox__stage" id="lightbox-stage">
      <img class="lightbox__img" id="lightbox-img" alt="">
    </div>

    <div class="lightbox__foot">
      <button type="button" class="lightbox__button" data-lightbox="prev" aria-label="تصویر قبلی">
        <span class="lightbox__glyph lightbox__glyph--prev" aria-hidden="true">&larr;</span>
      </button>

      <p class="lightbox__caption" id="lightbox-caption"></p>

      <button type="button" class="lightbox__button" data-lightbox="next" aria-label="تصویر بعدی">
        <span class="lightbox__glyph lightbox__glyph--next" aria-hidden="true">&rarr;</span>
      </button>
    </div>
  </dialog>

  <script src="assets/js/reveal.js" defer></script>
  <script src="assets/js/lightbox.js" defer></script>
</body>
</html>
